# SPIRE server for trust domain corp.example, plus the OIDC discovery provider as a sidecar.
# The sidecar reads the JWT-SVID signing keys over the server's local admin socket and
# publishes them as a JWKS at /keys. The Agent Identity Broker fetches that to verify SVIDs.
apiVersion: v1
kind: Namespace
metadata:
  name: spire
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-server
  namespace: spire
---
# k8s_psat node attestation: the server asks the Kubernetes API to validate the agent's
# projected service account token and looks up the pod and node it came from.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spire-server
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spire-server
subjects:
  - kind: ServiceAccount
    name: spire-server
    namespace: spire
roleRef:
  kind: ClusterRole
  name: spire-server
  apiGroup: rbac.authorization.k8s.io
---
# The k8sbundle notifier keeps the trust bundle in the spire-bundle ConfigMap current,
# so agents can bootstrap trust in the server.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spire-server-bundle
  namespace: spire
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["spire-bundle"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spire-server-bundle
  namespace: spire
subjects:
  - kind: ServiceAccount
    name: spire-server
    namespace: spire
roleRef:
  kind: Role
  name: spire-server-bundle
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-bundle
  namespace: spire
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-server
  namespace: spire
data:
  server.conf: |
    server {
      bind_address = "0.0.0.0"
      bind_port = "8081"
      socket_path = "/tmp/spire-server/private/api.sock"
      trust_domain = "corp.example"
      data_dir = "/run/spire/data"
      log_level = "INFO"
      ca_ttl = "24h"
      default_x509_svid_ttl = "1h"
      # JWT-SVIDs are bearer tokens: keep them short.
      default_jwt_svid_ttl = "5m"
    }
    plugins {
      DataStore "sql" {
        plugin_data {
          database_type = "sqlite3"
          connection_string = "/run/spire/data/datastore.sqlite3"
        }
      }
      NodeAttestor "k8s_psat" {
        plugin_data {
          clusters = {
            "spire-lab" = {
              service_account_allow_list = ["spire:spire-agent"]
            }
          }
        }
      }
      KeyManager "disk" {
        plugin_data {
          keys_path = "/run/spire/data/keys.json"
        }
      }
      Notifier "k8sbundle" {
        plugin_data {
          namespace = "spire"
        }
      }
    }
    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }
  oidc-discovery-provider.conf: |
    log_level = "INFO"
    # Lab only: plain HTTP. In production serve HTTPS (ACME or a serving certificate).
    insecure_addr = ":8008"
    allow_insecure_scheme = true
    domains = ["spire-oidc.spire.svc", "spire-oidc.spire.svc.cluster.local", "localhost"]
    server_api {
      address = "unix:///tmp/spire-server/private/api.sock"
    }
    health_checks {
      bind_port = "8009"
      live_path = "/live"
      ready_path = "/ready"
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spire-server
  namespace: spire
spec:
  replicas: 1
  serviceName: spire-server
  selector:
    matchLabels:
      app: spire-server
  template:
    metadata:
      labels:
        app: spire-server
    spec:
      serviceAccountName: spire-server
      containers:
        - name: spire-server
          image: ghcr.io/spiffe/spire-server:1.15.3
          args: ["-config", "/run/spire/config/server.conf"]
          ports:
            - containerPort: 8081
          volumeMounts:
            - name: config
              mountPath: /run/spire/config
              readOnly: true
            - name: data
              mountPath: /run/spire/data
            - name: server-socket
              mountPath: /tmp/spire-server/private
          livenessProbe:
            httpGet: { path: /live, port: 8080 }
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            initialDelaySeconds: 5
        - name: oidc-discovery-provider
          image: ghcr.io/spiffe/oidc-discovery-provider:1.15.3
          args: ["-config", "/run/spire/config/oidc-discovery-provider.conf"]
          ports:
            - containerPort: 8008
          volumeMounts:
            - name: config
              mountPath: /run/spire/config
              readOnly: true
            - name: server-socket
              mountPath: /tmp/spire-server/private
              readOnly: true
          readinessProbe:
            httpGet: { path: /ready, port: 8009 }
            initialDelaySeconds: 5
      volumes:
        - name: config
          configMap:
            name: spire-server
        - name: server-socket
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: spire-server
  namespace: spire
spec:
  selector:
    app: spire-server
  ports:
    - name: grpc
      port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: spire-oidc
  namespace: spire
spec:
  selector:
    app: spire-server
  ports:
    - name: http
      port: 80
      targetPort: 8008
