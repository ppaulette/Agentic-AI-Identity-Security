[project]
name = "authzen-pdp"
version = "0.1.0"
description = "OpenID AuthZEN policy decision point for agent tool calls"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/authzen_pdp"]

