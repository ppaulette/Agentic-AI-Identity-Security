[project]
name = "mcp-gateway"
version = "0.1.0"
description = "OAuth-protected MCP tool server with DPoP, introspection and per-call AuthZEN checks"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "httpx>=0.27", "idkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway"]

[tool.uv.sources]
idkit = { workspace = true }
