[project]
name = "scim-server"
version = "0.1.0"
description = "SCIM 2.0 provisioning server that revokes agent access on deprovision"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "httpx>=0.27", "idkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scim_server"]

[tool.uv.sources]
idkit = { workspace = true }
