[project]
name = "idkit"
version = "0.1.0"
description = "Shared JOSE, DPoP and audit helpers"
requires-python = ">=3.12"
dependencies = ["pyjwt[crypto]>=2.9", "cryptography>=43"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idkit"]

