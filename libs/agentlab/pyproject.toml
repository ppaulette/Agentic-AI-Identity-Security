[project]
name = "agentlab"
version = "0.1.0"
description = "Wires the IdP, SCIM server, broker, PDP and MCP gateway together in one process"
requires-python = ">=3.12"
dependencies = ["idkit", "scim-server", "authzen-pdp", "agent-broker", "mcp-gateway"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlab"]

[tool.uv.sources]
idkit = { workspace = true }
scim-server = { workspace = true }
authzen-pdp = { workspace = true }
agent-broker = { workspace = true }
mcp-gateway = { workspace = true }
