name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Red-team report
        run: uv run python -m redteam --out reports/redteam-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: redteam-report
          path: reports/redteam-report.md
